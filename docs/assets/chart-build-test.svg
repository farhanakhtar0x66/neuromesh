<text x="28" y="40" fill="#F2F2F2" font-size="19" font-weight="600">Building a terminal app from one prompt</text><text x="28" y="62" fill="#A3A3A3" font-size="13">A typing-speed test, scored on a 27-point rubric written before any app was built. One run each.</text><rect x="28" y="78" width="12" height="12" rx="3" fill="#2FA86E"/><text x="46" y="89" fill="#F2F2F2" font-size="13">Neuromesh: Opus 5.5 leads, GPT-6 Luna builds</text><rect x="358" y="78" width="12" height="12" rx="3" fill="#8C6BE0"/><text x="376" y="89" fill="#F2F2F2" font-size="13">Opus 5.5 (medium) alone</text><text x="28" y="122" fill="#A3A3A3" font-size="13" font-weight="600">Score (out of 27, higher is better)</text><line x1="62" x2="418" y1="326" y2="326" stroke="#363636"/><text x="56" y="330" fill="#6E6E6E" font-size="11" text-anchor="end">0</text><line x1="62" x2="418" y1="269" y2="269" stroke="#262626"/><text x="56" y="273" fill="#6E6E6E" font-size="11" text-anchor="end">9</text><line x1="62" x2="418" y1="212" y2="212" stroke="#262626"/><text x="56" y="216" fill="#6E6E6E" font-size="11" text-anchor="end">18</text><line x1="62" x2="418" y1="155" y2="155" stroke="#262626"/><text x="56" y="159" fill="#6E6E6E" font-size="11" text-anchor="end">27</text><path d="M91.33333333333334 326V178Q91.33333333333334 174 95.33333333333334 174H121.33333333333334Q125.33333333333334 174 125.33333333333334 178V326Z" fill="#2FA86E"/><text x="108.33333333333334" y="168" fill="#F2F2F2" font-size="12" text-anchor="middle">24</text><path d="M127.33333333333334 326V190.66666666666669Q127.33333333333334 186.66666666666669 131.33333333333334 186.66666666666669H157.33333333333334Q161.33333333333334 186.66666666666669 161.33333333333334 190.66666666666669V326Z" fill="#8C6BE0"/><text x="144.33333333333334" y="180.66666666666669" fill="#F2F2F2" font-size="12" text-anchor="middle">22</text><text x="126.33333333333334" y="346" fill="#A3A3A3" font-size="12" text-anchor="middle">One line</text><path d="M208.00000000000003 326V159Q208.00000000000003 155 212.00000000000003 155H238.00000000000003Q242.00000000000003 155 242.00000000000003 159V326Z" fill="#2FA86E"/><text x="225.00000000000003" y="149" fill="#F2F2F2" font-size="12" text-anchor="middle">27</text><path d="M244.00000000000003 326V162.16666666666669Q244.00000000000003 158.16666666666669 248.00000000000003 158.16666666666669H274Q278 158.16666666666669 278 162.16666666666669V326Z" fill="#8C6BE0"/><text x="261" y="152.16666666666669" fill="#F2F2F2" font-size="12" text-anchor="middle">26.5</text><text x="243.00000000000003" y="346" fill="#A3A3A3" font-size="12" text-anchor="middle">Detailed</text><path d="M324.6666666666667 326V159Q324.6666666666667 155 328.6666666666667 155H354.6666666666667Q358.6666666666667 155 358.6666666666667 159V326Z" fill="#2FA86E"/><text x="341.6666666666667" y="149" fill="#F2F2F2" font-size="12" text-anchor="middle">27</text><path d="M360.6666666666667 326V159Q360.6666666666667 155 364.6666666666667 155H390.6666666666667Q394.6666666666667 155 394.6666666666667 159V326Z" fill="#8C6BE0"/><text x="377.6666666666667" y="149" fill="#F2F2F2" font-size="12" text-anchor="middle">27</text><text x="359.6666666666667" y="346" fill="#A3A3A3" font-size="12" text-anchor="middle">Step list</text><text x="462" y="122" fill="#A3A3A3" font-size="13" font-weight="600">Estimated API cost per build (lower is better)</text><line x1="496" x2="852" y1="326" y2="326" stroke="#363636"/><text x="490" y="330" fill="#6E6E6E" font-size="11" text-anchor="end">$0</text><line x1="496" x2="852" y1="278.5" y2="278.5" stroke="#262626"/><text x="490" y="282.5" fill="#6E6E6E" font-size="11" text-anchor="end">$1</text><line x1="496" x2="852" y1="231" y2="231" stroke="#262626"/><text x="490" y="235" fill="#6E6E6E" font-size="11" text-anchor="end">$2</text><line x1="496" x2="852" y1="183.5" y2="183.5" stroke="#262626"/><text x="490" y="187.5" fill="#6E6E6E" font-size="11" text-anchor="end">$3</text><line x1="496" x2="852" y1="136" y2="136" stroke="#262626"/><text x="490" y="140" fill="#6E6E6E" font-size="11" text-anchor="end">$4</text><path d="M525.3333333333334 326V302.45Q525.3333333333334 298.45 529.3333333333334 298.45H555.3333333333334Q559.3333333333334 298.45 559.3333333333334 302.45V326Z" fill="#2FA86E"/><text x="542.3333333333334" y="292.45" fill="#F2F2F2" font-size="12" text-anchor="middle">$0.58</text><path d="M561.3333333333334 326V293.9Q561.3333333333334 289.9 565.3333333333334 289.9H591.3333333333334Q595.3333333333334 289.9 595.3333333333334 293.9V326Z" fill="#8C6BE0"/><text x="578.3333333333334" y="283.9" fill="#F2F2F2" font-size="12" text-anchor="middle">$0.76</text><text x="560.3333333333334" y="346" fill="#A3A3A3" font-size="12" text-anchor="middle">One line</text><path d="M642 326V303.4Q642 299.4 646 299.4H672Q676 299.4 676 303.4V326Z" fill="#2FA86E"/><text x="659" y="293.4" fill="#F2F2F2" font-size="12" text-anchor="middle">$0.56</text><path d="M678 326V239.275Q678 235.275 682 235.275H708Q712 235.275 712 239.275V326Z" fill="#8C6BE0"/><text x="695" y="229.275" fill="#F2F2F2" font-size="12" text-anchor="middle">$1.91</text><text x="677" y="346" fill="#A3A3A3" font-size="12" text-anchor="middle">Detailed</text><path d="M758.6666666666667 326V164.225Q758.6666666666667 160.225 762.6666666666667 160.225H788.6666666666667Q792.6666666666667 160.225 792.6666666666667 164.225V326Z" fill="#2FA86E"/><text x="775.6666666666667" y="154.225" fill="#F2F2F2" font-size="12" text-anchor="middle">$3.49</text><path d="M794.6666666666667 326V261.6Q794.6666666666667 257.6 798.6666666666667 257.6H824.6666666666667Q828.6666666666667 257.6 828.6666666666667 261.6V326Z" fill="#8C6BE0"/><text x="811.6666666666667" y="251.60000000000002" fill="#F2F2F2" font-size="12" text-anchor="middle">$1.44</text><text x="793.6666666666667" y="346" fill="#A3A3A3" font-size="12" text-anchor="middle">Step list</text><text x="28" y="374" fill="#6E6E6E" font-size="11.5">Step list: a tester reversed itself and sent the task to an Opus rebuild ($2.34). Both causes are fixed; that build has not been rerun.</text><text x="28" y="390" fill="#6E6E6E" font-size="11.5">Costs are estimates at API list prices; the runs used subscriptions. Source: docs/08-build-test.md.</text>
