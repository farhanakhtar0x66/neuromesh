<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-label="How a Neuromesh run works" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>How a Neuromesh run works</title>
<rect width="880" height="330" rx="12" fill="#101010"/>
<rect x="0.5" y="0.5" width="879" height="329" rx="12" fill="none" stroke="#363636"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A3A3A3"/></marker></defs><text x="28" y="40" fill="#F2F2F2" font-size="19" font-weight="600">How a run works</text><text x="28" y="62" fill="#A3A3A3" font-size="13">Cheap models do the work, the project's own checks judge it, and the expensive model is called only when it pays.</text><rect x="28" y="100" width="140" height="86" rx="10" fill="#161616" stroke="#363636" stroke-width="1.4"/><text x="98" y="125" fill="#F2F2F2" font-size="14" font-weight="600" text-anchor="middle">Your request</text><text x="98" y="145" fill="#A3A3A3" font-size="11.5" text-anchor="middle">typed, or a plan file</text><text x="98" y="161" fill="#A3A3A3" font-size="11.5" text-anchor="middle">and attachments</text><rect x="198" y="100" width="150" height="86" rx="10" fill="#161616" stroke="#363636" stroke-width="1.4"/><text x="273" y="125" fill="#F2F2F2" font-size="14" font-weight="600" text-anchor="middle">Brief engine</text><text x="273" y="145" fill="#A3A3A3" font-size="11.5" text-anchor="middle">no model call: cleans it,</text><text x="273" y="161" fill="#A3A3A3" font-size="11.5" text-anchor="middle">picks the team</text><rect x="378" y="100" width="150" height="86" rx="10" fill="#161616" stroke="#2FA86E" stroke-width="1.4"/><text x="453" y="125" fill="#F2F2F2" font-size="14" font-weight="600" text-anchor="middle">Worker</text><text x="453" y="145" fill="#A3A3A3" font-size="11.5" text-anchor="middle">builds in its own copy</text><text x="453" y="161" fill="#A3A3A3" font-size="11.5" text-anchor="middle">of your repository</text><rect x="558" y="100" width="140" height="86" rx="10" fill="#161616" stroke="#2FA86E" stroke-width="1.4"/><text x="628" y="125" fill="#F2F2F2" font-size="14" font-weight="600" text-anchor="middle">Checks + tester</text><text x="628" y="145" fill="#A3A3A3" font-size="11.5" text-anchor="middle">your tests, the app's</text><text x="628" y="161" fill="#A3A3A3" font-size="11.5" text-anchor="middle">screens, a review</text><rect x="728" y="100" width="124" height="86" rx="10" fill="#161616" stroke="#363636" stroke-width="1.4"/><text x="790" y="125" fill="#F2F2F2" font-size="14" font-weight="600" text-anchor="middle">You</text><text x="790" y="145" fill="#A3A3A3" font-size="11.5" text-anchor="middle">read the report,</text><text x="790" y="161" fill="#A3A3A3" font-size="11.5" text-anchor="middle">apply the diff</text><path d="M168 143L196 143" stroke="#A3A3A3" stroke-width="1.4" fill="none" marker-end="url(#a)"/><path d="M348 143L376 143" stroke="#A3A3A3" stroke-width="1.4" fill="none" marker-end="url(#a)"/><path d="M528 143L556 143" stroke="#A3A3A3" stroke-width="1.4" fill="none" marker-end="url(#a)"/><path d="M698 143L726 143" stroke="#A3A3A3" stroke-width="1.4" fill="none" marker-end="url(#a)"/><path d="M628 186C628 220 453 220 453 188" stroke="#A3A3A3" stroke-width="1.4" fill="none" marker-end="url(#a)"/><text x="470" y="232" fill="#A3A3A3" font-size="11.5">fails: the worker repairs, in the same session</text><rect x="275" y="244" width="270" height="64" rx="10" fill="#161616" stroke="#8C6BE0" stroke-width="1.4"/><text x="410" y="269" fill="#F2F2F2" font-size="14" font-weight="600" text-anchor="middle">Expert (Opus, Sol…)</text><text x="410" y="289" fill="#A3A3A3" font-size="11.5" text-anchor="middle">a spec for something new · advice when stuck</text><path d="M410 244L410 190" stroke="#A3A3A3" stroke-width="1.4" fill="none" marker-end="url(#a)" stroke-dasharray="4 4"/><text x="565" y="282" fill="#6E6E6E" font-size="11.5">0–1% of tokens on the v0.1 suite</text>
</svg>
